name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # The long crash fuzzer run, nightly.
    - cron: "0 4 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: rustup update stable && rustup default stable && rustup component add rustfmt clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Format
        id: format
        run: cargo fmt --all -- --check

      # Every later step runs regardless, so one run reports every problem
      # instead of stopping at the first.
      - name: Clippy
        if: always()
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        if: always()
        run: cargo test --all-targets

      - name: Doc tests
        if: always()
        run: cargo test --doc

      # When formatting failed, publish the exact patch rustfmt wants applied.
      - name: Formatting patch
        if: always() && steps.format.outcome == 'failure'
        run: |
          cargo fmt --all
          git diff > rustfmt.patch
          echo "--- rustfmt.patch ---"
          cat rustfmt.patch

      - name: Upload formatting patch
        if: always() && steps.format.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-patch
          path: rustfmt.patch

  windows:
    name: test on windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup update stable && rustup default stable
      - name: Test
        run: cargo test --all-targets

  fuzz:
    name: crash fuzzer, long run
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup update stable && rustup default stable
      - name: Cut the power twenty thousand times
        env:
          LASTRO_FUZZ_SEEDS: "20000"
        run: cargo test --release --test crash_fuzz -- --nocapture
